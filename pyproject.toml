[project]
name = "hivemind-swarm"
version = "0.1.0"
description = "Serverless Swarm AI for GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.4.0",
    "openai>=1.0.0",
    "json-repair>=0.25.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "line-too-long",
    "broad-except",
    "invalid-name"
]
max-line-length = 120

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = [
    ".github/scripts",
]
